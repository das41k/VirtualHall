<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>

    <!-- Глобальные стили (шапка, бургер, кнопки, инпуты) -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <!-- Стили для страниц авторизации (login + register) -->
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>

<!-- Подключаем фрагмент шапки -->
<div th:replace="~{fragments/header :: menu-overlay}"></div>
<header th:replace="~{fragments/header :: header}"></header>

<!-- Контент страницы -->
<main class="auth-content">
    <div class="auth-card">
        <h1 class="auth-card__title">Вход</h1>
        <p class="auth-card__subtitle">Добро пожаловать обратно!</p>

        <div th:if="${param.error}" class="alert alert--error">
            Неверный email/телефон или пароль
        </div>

        <div th:if="${param.registered}" class="alert alert--success">
            Регистрация прошла успешно! Войдите в систему.
        </div>

        <form th:action="@{/process-login}" method="post" class="auth-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div class="form-group">
                <label for="username" class="form-label">Email или телефон</label>
                <input type="text" id="username" name="username" class="form-input"
                       placeholder="example@mail.ru" required>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Пароль</label>
                <input type="password" id="password" name="password" class="form-input"
                       placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn--primary">Войти</button>
        </form>

        <div class="auth-footer">
            <a th:href="@{/register}" class="btn btn--link">Нет аккаунта? Зарегистрироваться</a>
            <br>
            <a th:href="@{/events}" class="btn btn--link" style="margin-top: 0.5rem;">
                ← Вернуться к событиям
            </a>
        </div>
    </div>
</main>

<!-- Подключение JS -->
<script th:src="@{/js/main.js}" defer></script>
</body>
</html>
