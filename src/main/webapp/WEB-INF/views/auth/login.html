<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Вход в личный кабинет</title>
</head>
<body>
    <h2>Вход в личный кабинет</h2>

    <div th:if="${param.error}">
        <p style="color: red;">Неверный email/телефон или пароль</p>
    </div>

    <div th:if="${param.registered}">
        <p style="color: green;">Регистрация прошла успешно! Войдите в систему.</p>
    </div>

    <form th:action="@{/process-login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <p>
            <label for="username">Email или телефон:</label><br>
            <input type="text" id="username" name="username"
                   placeholder="example@mail.ru или +7(123)456-78-90"
                   required>
        </p>

        <p>
            <label for="password">Пароль:</label><br>
            <input type="password" id="password" name="password"
                   placeholder="Введите пароль"
                   required>
        </p>

        <p>
            <button type="submit">Войти</button>
        </p>
    </form>

    <p>
        <a th:href="@{/register}">Нет аккаунта? Зарегистрироваться</a>
    </p>

    <p>
        <a th:href="@{/events}">← Вернуться к событиям</a>
    </p>
</body>
</html>
