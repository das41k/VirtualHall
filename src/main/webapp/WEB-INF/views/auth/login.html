<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Вход в личный кабинет</title>
</head>
<body>
    <h2>Вход в личный кабинет</h2>

    <div th:if="${param.error}">
        <p style="color: red;">Неверный email/телефон или пароль</p>
    </div>

    <form th:action="@{/process-login}" th:method="POST">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <p>
            <label>
                <input type="radio" name="loginType" value="email" checked onclick="toggleLoginField()">
                Войти по email
            </label>
            <br>
            <label>
                <input type="radio" name="loginType" value="phone" onclick="toggleLoginField()">
                Войти по телефону
            </label>
        </p>

        <p id="emailField">
            <label for="email">Email:</label><br>
            <input type="text" id="email" name="email"
                   placeholder="example@mail.ru">
        </p>

        <p id="phoneField" style="display: none;">
            <label for="phone">Телефон:</label><br>
            <input type="text" id="phone" name="phone"
                   placeholder="+7(123)456-78-90">
        </p>

        <p>
            <label for="password">Пароль:</label><br>
            <input type="password" id="password" name="password" required>
        </p>

        <p>
            <button type="submit">Войти</button>
        </p>
    </form>

    <p>
        <a th:href="@{/register}">Нет аккаунта? Зарегистрироваться</a><br>
        <a th:href="@{/events}">Вернуться к событиям</a>
    </p>

    <!-- Подключаем JS -->
    <script th:src="@{/js/login.js}"></script>
    </body>
</html>
